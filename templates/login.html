{% extends "base.html" %}

{% block title %}Login & Register | Apex Fabrication System{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
        
        <!-- Header Logo & Title -->
        <div class="text-center">
            <div class="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center text-2xl mx-auto mb-3">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">System Portal Access</h2>
            <p class="text-xs text-slate-400 mt-1">Login to your account or register as a new customer</p>
        </div>

        <!-- Simple Tab Switcher (Login vs Register) -->
        <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
            <button type="button" id="tab-login" onclick="showTab('login')" class="py-2.5 rounded-lg text-xs font-bold transition bg-amber-500 text-slate-950 shadow-md">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Login
            </button>
            <button type="button" id="tab-register" onclick="showTab('register')" class="py-2.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white">
                <i class="fa-solid fa-user-plus me-1"></i> Register Customer
            </button>
        </div>

        <!-- 1. SIMPLE LOGIN FORM -->
        <form id="form-login" action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1.5">Username or Email *</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" name="username" required placeholder="Enter username or email" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1.5">Password *</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <input type="password" name="password" required placeholder="••••••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold rounded-xl hover:from-amber-400 hover:to-amber-500 transition shadow-lg text-sm uppercase tracking-wider">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Login Now
            </button>

            <div class="text-center pt-2">
                <p class="text-xs text-slate-400">
                    New Customer? <button type="button" onclick="showTab('register')" class="text-amber-400 font-semibold hover:underline">Register Customer Profile</button>
                </p>
            </div>
        </form>

        <!-- 2. SIMPLE REGISTER FORM -->
        <form id="form-register" action="{{ url_for('register') }}" method="POST" class="space-y-3.5 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Account Role *</label>
                <select name="role" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-amber-500">
                    <option value="customer">Customer</option>
                    <option value="manager">Manager</option>
                    <option value="staff">Staff</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Full Name *</label>
                <input type="text" name="contact_person" required placeholder="Enter full name" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Phone / Mobile Number *</label>
                <input type="tel" name="phone" required placeholder="+91 9876543210" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Username *</label>
                <input type="text" name="username" required placeholder="Choose username" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password *</label>
                <input type="password" name="password" required placeholder="Create password" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold rounded-xl hover:from-amber-400 hover:to-amber-500 transition shadow-lg text-sm uppercase tracking-wider">
                <i class="fa-solid fa-user-plus me-1"></i> Register Account
            </button>

            <div class="text-center pt-1">
                <p class="text-xs text-slate-400">
                    Already registered? <button type="button" onclick="showTab('login')" class="text-amber-400 font-semibold hover:underline">Login Here</button>
                </p>
            </div>
        </form>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function showTab(mode) {
        const formLogin = document.getElementById('form-login');
        const formReg = document.getElementById('form-register');
        const btnLogin = document.getElementById('tab-login');
        const btnReg = document.getElementById('tab-register');

        if (mode === 'register') {
            formLogin.classList.add('hidden');
            formReg.classList.remove('hidden');

            btnReg.className = "py-2.5 rounded-lg text-xs font-bold transition bg-amber-500 text-slate-950 shadow-md";
            btnLogin.className = "py-2.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white";
        } else {
            formReg.classList.add('hidden');
            formLogin.classList.remove('hidden');

            btnLogin.className = "py-2.5 rounded-lg text-xs font-bold transition bg-amber-500 text-slate-950 shadow-md";
            btnReg.className = "py-2.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white";
        }
    }

    // Auto-check URL parameter tab=register
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tab') === 'register') {
            showTab('register');
        }
    });
</script>
{% endblock %}
